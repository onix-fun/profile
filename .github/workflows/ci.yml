name: Profile CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: onix-fun/account, path: contract-account }
      - uses: actions/checkout@v4
        with: { repository: onix-fun/search, path: contract-search }
      - run: |
          mkdir -p .contracts/{account,search}
          cp -R contract-account/api/proto .contracts/account/proto
          cp -R contract-search/api/proto .contracts/search/proto
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle --no-daemon test checkModuleBoundaries :app:installDist
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
