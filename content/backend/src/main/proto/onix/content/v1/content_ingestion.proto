syntax = "proto3";

package onix.content.v1;

option java_multiple_files = true;
option java_package = "com.onix.content.v1";

service ContentIngestion {
  rpc GetProfileContent(ProfileContentRequest) returns (ProfileContentResponse);
}

service ContentSearch {
  rpc GetProfileContent(ProfileContentRequest) returns (ProfileContentResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
}

service ContentProvider {
  rpc ResolveCollectionItems(ResolveCollectionItemsRequest) returns (ResolveCollectionItemsResponse);
  rpc ListOwnerSection(OwnerSectionRequest) returns (OwnerSectionResponse);
}

service ProfileUsage {
  rpc ReportOwnerServiceUsage(OwnerServiceUsageReport) returns (OwnerServiceUsageAck);
}

message ProfileContentRequest {
  string owner_type = 5;
  string owner_id = 1;
  string viewer_type = 6;
  string viewer_id = 2;
  int32 post_limit = 3;
  int32 story_limit = 4;
}

message ProfileContentResponse {
  repeated ProfilePost posts = 1;
  repeated ProfileStory stories = 2;
  repeated ProfileComment comments = 3;
  repeated ProfileCollection collections = 4;
}

message ProfilePost {
  string id = 1;
  string author_id = 9;
  string owner_type = 10;
  string owner_id = 11;
  ProfileOwner author = 12;
  string title = 2;
  string text = 3;
  repeated string tags = 4;
  string created_at = 5;
  int64 like_count = 6;
  bool liked_by_viewer = 7;
  repeated ContentBlock blocks = 8;
}

message ProfileStory {
  string id = 1;
  string visibility = 2;
  string expires_at = 3;
}

message ProfileStoryDetail {
  string id = 1;
  string author_id = 2;
  string owner_type = 3;
  string owner_id = 4;
  ProfileOwner author = 5;
  string visibility = 6;
  repeated ContentBlock blocks = 7;
  int64 duration_ms = 8;
  int64 media_duration_ms = 9;
  bool close_friends = 10;
  bool archived = 11;
  int64 like_count = 12;
  bool liked_by_viewer = 13;
  int64 remaining_life_seconds = 14;
  string created_at = 15;
  string expires_at = 16;
}

message ProfileComment {
  string id = 1;
  string post_id = 2;
  string text = 3;
  string created_at = 4;
}

message ProfileCollection {
  string id = 1;
  string owner_type = 2;
  string owner_id = 3;
  string title = 4;
  string description = 5;
  string cover_json = 6;
  string visibility = 7;
  int32 item_count = 8;
  repeated ContentBlock preview_blocks = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ContentBlock {
  string id = 1;
  string type = 2;
  string data_json = 3;
}

message ProfileOwner {
  string id = 1;
  string owner_type = 2;
  string username = 3;
  string display_name = 4;
  string first_name = 5;
  string last_name = 6;
  string avatar_url = 7;
}

message SearchRequest {
  string query = 1;
  repeated string types = 2;
  repeated string tags = 3;
  string author = 4;
  string date_from = 5;
  string date_to = 6;
  string sort = 7;
  int32 limit = 8;
  string cursor = 9;
  string viewer_type = 10;
  string viewer_id = 11;
}

message SearchResponse {
  repeated SearchItem items = 1;
  string next_cursor = 2;
  repeated string partial_errors = 3;
}

message SearchItem {
  string type = 1;
  string id = 2;
  string title = 3;
  string snippet = 4;
  ProfileOwner owner = 5;
  string url = 6;
  double score = 7;
  string created_at = 8;
  string post_id = 9;
  string comment_id = 10;
  repeated string tags = 11;
  map<string, string> meta = 12;
}

message SuggestRequest {
  string query = 1;
  int32 limit = 2;
  string viewer_type = 3;
  string viewer_id = 4;
}

message SuggestResponse {
  repeated SearchSuggestion suggestions = 1;
  repeated string partial_errors = 2;
}

message SearchSuggestion {
  string type = 1;
  string value = 2;
  string label = 3;
}

message CollectionItemRef {
  string service_key = 1;
  string item_type = 2;
  string item_id = 3;
}

message CollectionItemView {
  CollectionItemRef ref = 1;
  string title = 2;
  string text = 3;
  repeated ContentBlock preview_blocks = 4;
  string url = 5;
  string created_at = 6;
  ProfileOwner owner = 7;
  ProfilePost post = 8;
  ProfileStoryDetail story = 9;
  map<string, string> meta = 10;
}

message ResolveCollectionItemsRequest {
  repeated CollectionItemRef refs = 1;
  string viewer_type = 2;
  string viewer_id = 3;
  int32 limit = 4;
}

message ResolveCollectionItemsResponse {
  repeated CollectionItemView items = 1;
  repeated string partial_errors = 2;
}

message OwnerSectionRequest {
  string owner_type = 1;
  string owner_id = 2;
  string viewer_type = 3;
  string viewer_id = 4;
  string button_key = 5;
  int32 limit = 6;
  string cursor = 7;
}

message OwnerSectionResponse {
  repeated CollectionItemView items = 1;
  repeated ProfilePost posts = 2;
  repeated ProfileStoryDetail stories = 3;
  string next_cursor = 4;
  repeated string partial_errors = 5;
}

message OwnerServiceUsageReport {
  string owner_type = 1;
  string owner_id = 2;
  string service_key = 3;
  string feature_key = 4;
}

message OwnerServiceUsageAck {
  bool recorded = 1;
}
