name: profile-service

x-account-env: &account-env
  ACCOUNT_ENV: development
  ACCOUNT_DATABASE_JDBC_URL: jdbc:postgresql://account-postgres:5432/account
  ACCOUNT_DATABASE_USERNAME: account
  ACCOUNT_DATABASE_PASSWORD: ${ACCOUNT_DATABASE_PASSWORD:-account}
  ACCOUNT_REDIS_URL: redis://:${ACCOUNT_REDIS_PASSWORD:-account}@account-redis:6379
  ACCOUNT_SMTP_HOST: mail
  ACCOUNT_SMTP_PORT: "1025"
  ACCOUNT_SMTP_FROM: no-reply@account.local
  ACCOUNT_SMTP_STARTTLS: "false"
  ACCOUNT_S3_ENDPOINT: http://s3:9000
  ACCOUNT_S3_PUBLIC_URL: /api/avatars
  ACCOUNT_S3_ACCESS_KEY: ${ACCOUNT_S3_ACCESS_KEY:-account}
  ACCOUNT_S3_SECRET_KEY: ${ACCOUNT_S3_SECRET_KEY:-account-secret}
  ACCOUNT_S3_BUCKET: avatars
  ACCOUNT_JWT_ISSUER: account-service
  ACCOUNT_JWT_AUDIENCE: account
  ACCOUNT_JWT_ACTIVE_KID: dev
  ACCOUNT_JWT_PRIVATE_KEY_FILE: /run/secrets/account-jwt-private.pem
  ACCOUNT_JWT_PUBLIC_KEY_FILE: /run/secrets/account-jwt-public.pem
  ACCOUNT_SECURITY_OTP_HMAC_SECRET: ${ACCOUNT_SECURITY_OTP_HMAC_SECRET:-dev-hmac-secret-at-least-32-chars}
  ACCOUNT_SECURITY_INTERNAL_AUTH_SECRET: ${ACCOUNT_SECURITY_INTERNAL_AUTH_SECRET:-dev-internal-secret-at-least-32-chars}
  ACCOUNT_HTTP_ALLOWED_ORIGINS: http://profile.localhost:8088
  ACCOUNT_HTTP_COOKIE_DOMAIN: ${ACCOUNT_HTTP_COOKIE_DOMAIN:-}
  ACCOUNT_HTTP_COOKIE_SECURE: "false"
  ACCOUNT_API_BASE_URL: /api
  ACCOUNT_FRONTEND_BASE_PATH: /account/
  ACCOUNT_TRUSTED_REDIRECT_ORIGINS: http://profile.localhost:8088
  ACCOUNT_GRPC_ENABLED: "true"
  ACCOUNT_GRPC_PORT: "9097"

x-account-build: &account-build
  context: ./account-src
  dockerfile: ../account.Dockerfile

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - account
      - profile-service
      - content-service
      - profile-frontend

  account-migrate:
    image: ${ACCOUNT_IMAGE:-profile-service-account:dev}
    build: *account-build
    entrypoint: ["/usr/local/bin/migrate"]
    environment: *account-env
    volumes:
      - ./secrets/account-jwt-private.pem:/run/secrets/account-jwt-private.pem:ro
      - ./secrets/account-jwt-public.pem:/run/secrets/account-jwt-public.pem:ro
    depends_on:
      account-postgres: { condition: service_healthy }

  account:
    image: ${ACCOUNT_IMAGE:-profile-service-account:dev}
    build: *account-build
    environment: *account-env
    volumes:
      - ./secrets/account-jwt-private.pem:/run/secrets/account-jwt-private.pem:ro
      - ./secrets/account-jwt-public.pem:/run/secrets/account-jwt-public.pem:ro
    depends_on:
      account-migrate: { condition: service_completed_successfully }
      account-redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
      mail: { condition: service_started }

  profile-service:
    build:
      context: ..
      dockerfile: profile-service/Dockerfile
    environment:
      PROFILE_HTTP_PORT: "8080"
      PROFILE_ACCOUNT_GRPC_URL: account:9097
      PROFILE_ACCOUNT_GRPC_TLS: "false"
      PROFILE_ACCOUNT_FRONTEND_URL: http://profile.localhost:8088/account
      PROFILE_PUBLIC_URL: http://profile.localhost:8088
      PROFILE_ALLOWED_ORIGINS: http://profile.localhost:8088
      PROFILE_CONTENT_API_URL: http://content-service:8080/internal/profile
      PROFILE_CONTENT_GRPC_URL: content-service:9091
    depends_on:
      account: { condition: service_started }
      content-service: { condition: service_started }

  content-service:
    build:
      context: ..
      dockerfile: content-service/Dockerfile
    environment:
      CONTENT_HTTP_PORT: "8080"
      CONTENT_ALLOWED_ORIGINS: http://profile.localhost:8088
      CONTENT_ACCOUNT_GRPC_URL: account:9097
      CONTENT_ACCOUNT_GRPC_TLS: "false"
      CONTENT_MEDIA_API_URL: http://media-service:8080
      CONTENT_SEARCH_API_URL: http://search-service:8080
      CONTENT_DATABASE_JDBC_URL: jdbc:postgresql://content-postgres:5432/content
      CONTENT_DATABASE_USERNAME: content
      CONTENT_DATABASE_PASSWORD: ${CONTENT_DATABASE_PASSWORD:-content}
      CONTENT_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
      CONTENT_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CONTENT_MEDIA_API_KEY: ${CONTENT_MEDIA_API_KEY:-development-media-secret}
      CONTENT_SEARCH_API_KEY: ${CONTENT_SEARCH_API_KEY:-development-search-secret}
      CONTENT_INTERNAL_AUTH_SECRET: ${CONTENT_INTERNAL_AUTH_SECRET:-development-content-secret}
    depends_on:
      content-postgres: { condition: service_healthy }
      clickhouse: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      media-service: { condition: service_started }
      search-service: { condition: service_started }

  profile-frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      PROFILE_API_BASE_URL: /api
      PROFILE_FRONTEND_BASE_PATH: /
      PROFILE_ACCOUNT_FRONTEND_URL: http://profile.localhost:8088/account
    depends_on:
      - profile-service
      - content-service

  content-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${CONTENT_DATABASE_PASSWORD:-content}
    volumes:
      - content_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    volumes:
      - content_clickhouse:/var/lib/clickhouse

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-profile-service-dev-cookie}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  media-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: media
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${MEDIA_DATABASE_PASSWORD:-media}
    volumes:
      - media_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 5s
      timeout: 5s
      retries: 10

  media-minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-media}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-media-secret}
    volumes:
      - media_minio:/data
    networks:
      default:
        aliases:
          - minio

  media-minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until mc alias set local http://media-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do echo "Waiting for media S3"; sleep 2; done; mc mb -p local/media-blobs || true; mc anonymous set download local/media-blobs || true
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-media}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-media-secret}
    depends_on:
      - media-minio

  media-service:
    image: ghcr.io/onix-fun/media-service:latest
    command: ["serve", "--config=/config/media.config.yaml"]
    environment:
      MEDIA_API_KEY: ${CONTENT_MEDIA_API_KEY:-development-media-secret}
      MEDIA_DATABASE_URL: postgres://media:${MEDIA_DATABASE_PASSWORD:-media}@media-postgres:5432/media?sslmode=disable
      S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-media}
      S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-media-secret}
      MEDIA_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./media.config.yaml:/config/media.config.yaml:ro
    depends_on:
      media-postgres: { condition: service_healthy }
      media-minio-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  search-redis:
    image: redis:8.2.6-alpine
    volumes:
      - search_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      default:
        aliases:
          - redis

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    environment:
      MEILI_MASTER_KEY: local-development-key
    volumes:
      - search_meili:/meili_data

  search-service:
    image: ghcr.io/onix-fun/search-service:latest
    command: ["serve", "--role=all", "--config=config/config.example.yaml"]
    environment:
      SEARCH_API_KEY: ${CONTENT_SEARCH_API_KEY:-development-search-secret}
    depends_on:
      search-redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      meilisearch: { condition: service_started }

  account-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: ${ACCOUNT_DATABASE_PASSWORD:-account}
    volumes:
      - account_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${ACCOUNT_REDIS_PASSWORD:-account}"
    volumes:
      - account_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${ACCOUNT_REDIS_PASSWORD:-account}' ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ACCOUNT_S3_ACCESS_KEY:-account}
      MINIO_ROOT_PASSWORD: ${ACCOUNT_S3_SECRET_KEY:-account-secret}
    volumes:
      - account_s3:/data

  s3-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until mc alias set local http://s3:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do echo "Waiting for account S3"; sleep 2; done; mc mb -p local/avatars || true
    environment:
      MINIO_ROOT_USER: ${ACCOUNT_S3_ACCESS_KEY:-account}
      MINIO_ROOT_PASSWORD: ${ACCOUNT_S3_SECRET_KEY:-account-secret}
    depends_on:
      - s3

  mail:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_HTTP_PORT:-8027}:8025"

volumes:
  account_postgres:
  account_redis:
  account_s3:
  content_postgres:
  content_clickhouse:
  media_postgres:
  media_minio:
  rabbitmq_data:
  search_redis:
  search_meili:
