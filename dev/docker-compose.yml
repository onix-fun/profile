name: onix-local

x-account-env: &account-env
  ACCOUNT_ENV: development
  ACCOUNT_DATABASE_JDBC_URL: jdbc:postgresql://account-postgres:5432/account
  ACCOUNT_DATABASE_USERNAME: account
  ACCOUNT_DATABASE_PASSWORD: ${ACCOUNT_DATABASE_PASSWORD:-account}
  ACCOUNT_REDIS_URL: redis://:${ACCOUNT_REDIS_PASSWORD:-account}@account-redis:6379
  ACCOUNT_SMTP_HOST: mail
  ACCOUNT_SMTP_PORT: "1025"
  ACCOUNT_SMTP_FROM: no-reply@account.local
  ACCOUNT_SMTP_STARTTLS: "false"
  ACCOUNT_S3_ENDPOINT: http://s3:9000
  ACCOUNT_S3_PUBLIC_URL: /api/avatars
  ACCOUNT_S3_ACCESS_KEY: ${ACCOUNT_S3_ACCESS_KEY:-account}
  ACCOUNT_S3_SECRET_KEY: ${ACCOUNT_S3_SECRET_KEY:-account-secret}
  ACCOUNT_S3_BUCKET: avatars
  ACCOUNT_JWT_ISSUER: account-service
  ACCOUNT_JWT_AUDIENCE: account
  ACCOUNT_JWT_ACTIVE_KID: dev
  ACCOUNT_JWT_PRIVATE_KEY_FILE: /run/secrets/account-jwt-private.pem
  ACCOUNT_JWT_PUBLIC_KEY_FILE: /run/secrets/account-jwt-public.pem
  ACCOUNT_SECURITY_OTP_HMAC_SECRET: ${ACCOUNT_SECURITY_OTP_HMAC_SECRET:-dev-hmac-secret-at-least-32-chars}
  ACCOUNT_SECURITY_INTERNAL_AUTH_SECRET: ${ACCOUNT_SECURITY_INTERNAL_AUTH_SECRET:-dev-internal-secret-at-least-32-chars}
  ACCOUNT_HTTP_ALLOWED_ORIGINS: http://account.onix.localhost:8088,http://profile.onix.localhost:8088,http://content.onix.localhost:8088
  ACCOUNT_HTTP_COOKIE_DOMAIN: ${ACCOUNT_HTTP_COOKIE_DOMAIN:-.onix.localhost}
  ACCOUNT_HTTP_COOKIE_SECURE: "false"
  ACCOUNT_API_BASE_URL: /api
  ACCOUNT_FRONTEND_BASE_PATH: /
  ACCOUNT_TRUSTED_REDIRECT_ORIGINS: http://profile.onix.localhost:8088,http://content.onix.localhost:8088
  ACCOUNT_GRPC_ENABLED: "true"
  ACCOUNT_GRPC_PORT: "9097"

x-account-build: &account-build
  context: ../account
  dockerfile: Dockerfile.local
  additional_contexts:
    onix-design-system: ${ONIX_DESIGN_SYSTEM_CONTEXT:-../design-system}

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - account
      - profile-backend
      - content-backend
      - profile-frontend
      - content-frontend

  account-migrate:
    image: ${ACCOUNT_IMAGE:-profile-service-account:dev}
    build: *account-build
    entrypoint: ["/usr/local/bin/migrate"]
    environment: *account-env
    volumes:
      - ./secrets/account-jwt-private.pem:/run/secrets/account-jwt-private.pem:ro
      - ./secrets/account-jwt-public.pem:/run/secrets/account-jwt-public.pem:ro
    depends_on:
      account-postgres: { condition: service_healthy }

  account:
    image: ${ACCOUNT_IMAGE:-profile-service-account:dev}
    build: *account-build
    environment: *account-env
    volumes:
      - ./secrets/account-jwt-private.pem:/run/secrets/account-jwt-private.pem:ro
      - ./secrets/account-jwt-public.pem:/run/secrets/account-jwt-public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      account-migrate: { condition: service_completed_successfully }
      account-redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
      mail: { condition: service_started }

  profile-backend:
    build:
      context: ..
      dockerfile: profile/backend/Dockerfile
    environment:
      PROFILE_HTTP_PORT: "8080"
      PROFILE_ACCOUNT_GRPC_URL: account:9097
      PROFILE_ACCOUNT_GRPC_TLS: "false"
      PROFILE_ACCOUNT_FRONTEND_URL: http://account.onix.localhost:8088
      PROFILE_PUBLIC_URL: http://profile.onix.localhost:8088
      PROFILE_ALLOWED_ORIGINS: http://profile.onix.localhost:8088,http://content.onix.localhost:8088
      PROFILE_TRUSTED_REDIRECT_ORIGINS: http://profile.onix.localhost:8088,http://content.onix.localhost:8088
      PROFILE_CONTENT_GRPC_URL: content-backend:9091
      PROFILE_PROVIDER_CONTENT_GRPC_URL: content-backend:9091
      PROFILE_GRPC_PORT: "9092"
      PROFILE_DATABASE_JDBC_URL: jdbc:postgresql://profile-postgres:5432/profile
      PROFILE_DATABASE_USERNAME: profile
      PROFILE_DATABASE_PASSWORD: ${PROFILE_DATABASE_PASSWORD:-profile}
    depends_on:
      account: { condition: service_healthy }
      content-backend: { condition: service_started }
      profile-postgres: { condition: service_healthy }

  content-backend:
    build:
      context: ..
      dockerfile: content/backend/Dockerfile
    environment:
      CONTENT_HTTP_PORT: "8080"
      CONTENT_GRPC_PORT: "9091"
      CONTENT_ALLOWED_ORIGINS: http://content.onix.localhost:8088,http://profile.onix.localhost:8088
      CONTENT_ACCOUNT_GRPC_URL: account:9097
      CONTENT_ACCOUNT_GRPC_TLS: "false"
      CONTENT_MEDIA_GRPC_URL: media-service:9093
      CONTENT_MEDIA_GRPC_TLS: "false"
      CONTENT_SEARCH_GRPC_URL: search-service:9094
      CONTENT_SEARCH_GRPC_TLS: "false"
      CONTENT_DATABASE_JDBC_URL: jdbc:postgresql://content-postgres:5432/content
      CONTENT_DATABASE_USERNAME: content
      CONTENT_DATABASE_PASSWORD: ${CONTENT_DATABASE_PASSWORD:-content}
      CONTENT_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default
      CONTENT_MEDIA_API_KEY: ${CONTENT_MEDIA_API_KEY:-development-media-secret}
      CONTENT_SEARCH_API_KEY: ${CONTENT_SEARCH_API_KEY:-development-search-secret}
      CONTENT_INTERNAL_AUTH_SECRET: ${CONTENT_INTERNAL_AUTH_SECRET:-development-content-secret}
      CONTENT_PROFILE_USAGE_GRPC_URL: profile-backend:9092
    depends_on:
      account: { condition: service_healthy }
      content-postgres: { condition: service_healthy }
      clickhouse: { condition: service_started }
      media-service: { condition: service_started }
      search-service: { condition: service_healthy }

  profile-frontend:
    build:
      context: ..
      dockerfile: profile/frontend/Dockerfile
    environment:
      PROFILE_API_BASE_URL: /api
      PROFILE_FRONTEND_BASE_PATH: /
      PROFILE_ACCOUNT_FRONTEND_URL: http://account.onix.localhost:8088
      PROFILE_CONTENT_FRONTEND_URL: http://content.onix.localhost:8088
    depends_on:
      - profile-backend
      - content-backend

  content-frontend:
    build:
      context: ..
      dockerfile: content/frontend/Dockerfile
    environment:
      CONTENT_API_BASE_URL: /api
      CONTENT_GRAPHQL_URL: /graphql
      CONTENT_SUBSCRIPTIONS_URL: /subscriptions
      CONTENT_FRONTEND_BASE_PATH: /
      CONTENT_ACCOUNT_FRONTEND_URL: http://account.onix.localhost:8088
      CONTENT_PROFILE_FRONTEND_URL: http://profile.onix.localhost:8088
    depends_on:
      - content-backend

  content-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${CONTENT_DATABASE_PASSWORD:-content}
    volumes:
      - content_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 3s
      retries: 10

  profile-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: ${PROFILE_DATABASE_PASSWORD:-profile}
    volumes:
      - profile_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile -d profile"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    volumes:
      - content_clickhouse:/var/lib/clickhouse

  media-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: media
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${MEDIA_DATABASE_PASSWORD:-media}
    volumes:
      - media_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 5s
      timeout: 5s
      retries: 10

  media-minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-media}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-media-secret}
      # Browser uploads go to this published S3 port rather than through the
      # HTTP reverse proxy.  SigV4 signs Host, so an intermediary must never
      # get a chance to rewrite it.
      MINIO_API_CORS_ALLOW_ORIGIN: http://content.onix.localhost:8088
    ports:
      - "9010:9000"
    volumes:
      - media_minio:/data
    networks:
      default:
        aliases:
          - minio

  media-minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until mc alias set local http://media-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do echo "Waiting for media S3"; sleep 2; done; mc mb -p local/media-blobs || true; mc anonymous set none local/media-blobs || true
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-media}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-media-secret}
    depends_on:
      - media-minio

  media-service:
    build:
      context: ../media-service
      dockerfile: Dockerfile
    command: ["serve", "--config=/config/media.config.yaml"]
    environment:
      MEDIA_API_KEY: ${CONTENT_MEDIA_API_KEY:-development-media-secret}
      MEDIA_DATABASE_URL: postgres://media:${MEDIA_DATABASE_PASSWORD:-media}@media-postgres:5432/media?sslmode=disable
      S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-media}
      S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-media-secret}
    volumes:
      - ./media.config.yaml:/config/media.config.yaml:ro
    depends_on:
      media-postgres: { condition: service_healthy }
      media-minio-init: { condition: service_completed_successfully }

  search-redis:
    image: redis:8.2.6-alpine
    volumes:
      - search_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      default:
        aliases:
          - redis

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    environment:
      MEILI_MASTER_KEY: local-development-key
    volumes:
      - search_meili:/meili_data

  search-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: ${SEARCH_DATABASE_PASSWORD:-search}
    volumes:
      - search_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 5s
      timeout: 3s
      retries: 10

  search-service:
    build:
      context: ../search-service
      dockerfile: Dockerfile
    command: ["serve", "--role=all", "--config=config/config.example.yaml"]
    environment:
      SEARCH_API_KEY: ${CONTENT_SEARCH_API_KEY:-development-search-secret}
      SEARCH_DATABASE_URL: postgres://search:${SEARCH_DATABASE_PASSWORD:-search}@search-postgres:5432/search?sslmode=disable
    depends_on:
      search-redis: { condition: service_healthy }
      search-postgres: { condition: service_healthy }
      meilisearch: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  search-inference:
    build:
      context: ../search-inference
    environment:
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
    volumes:
      - search_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 10s
      timeout: 4s
      retries: 30
      start_period: 90s

  account-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: ${ACCOUNT_DATABASE_PASSWORD:-account}
    volumes:
      - account_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${ACCOUNT_REDIS_PASSWORD:-account}"
    volumes:
      - account_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${ACCOUNT_REDIS_PASSWORD:-account}' ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ACCOUNT_S3_ACCESS_KEY:-account}
      MINIO_ROOT_PASSWORD: ${ACCOUNT_S3_SECRET_KEY:-account-secret}
    volumes:
      - account_s3:/data

  s3-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until mc alias set local http://s3:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do echo "Waiting for account S3"; sleep 2; done; mc mb -p local/avatars || true
    environment:
      MINIO_ROOT_USER: ${ACCOUNT_S3_ACCESS_KEY:-account}
      MINIO_ROOT_PASSWORD: ${ACCOUNT_S3_SECRET_KEY:-account-secret}
    depends_on:
      - s3

  mail:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_HTTP_PORT:-8028}:8025"

volumes:
  search_models:
  account_postgres:
  account_redis:
  account_s3:
  profile_postgres:
  content_postgres:
  content_clickhouse:
  media_postgres:
  media_minio:
  search_redis:
  search_postgres:
  search_meili:
